name: AEMO NEM Generation Scraper

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AEMO NEM scraper
        run: python aemo_nem_scraper.py

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f nem_generation_by_fuel.csv nem_registration_list.xlsx
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "Add NEM generation snapshot ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push
          fi
